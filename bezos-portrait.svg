<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" width="600" height="700">
  <defs>
    <filter id="pencil" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="5" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <linearGradient id="shading" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#888;stop-opacity:0.8"/>
      <stop offset="50%" style="stop-color:#aaa;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#666;stop-opacity:0.7"/>
    </linearGradient>
    <radialGradient id="faceGrad" cx="50%" cy="40%" r="50%">
      <stop offset="0%" style="stop-color:#ddd;stop-opacity:0.9"/>
      <stop offset="70%" style="stop-color:#999;stop-opacity:0.7"/>
      <stop offset="100%" style="stop-color:#777;stop-opacity:0.5"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="700" fill="transparent"/>

  <!-- Head (bald) - pencil sketch style -->
  <g filter="url(#pencil)" opacity="0.85">
    <!-- Head shape -->
    <ellipse cx="300" cy="220" rx="130" ry="160" fill="url(#faceGrad)" stroke="#555" stroke-width="2"/>

    <!-- Ears -->
    <ellipse cx="170" cy="230" rx="25" ry="40" fill="url(#faceGrad)" stroke="#666" stroke-width="1.5"/>
    <ellipse cx="430" cy="230" rx="25" ry="40" fill="url(#faceGrad)" stroke="#666" stroke-width="1.5"/>

    <!-- Face details - sketchy lines -->
    <!-- Eyebrows -->
    <path d="M230 180 Q260 170 290 180" fill="none" stroke="#444" stroke-width="3" stroke-linecap="round"/>
    <path d="M310 180 Q340 170 370 180" fill="none" stroke="#444" stroke-width="3" stroke-linecap="round"/>

    <!-- Eyes -->
    <ellipse cx="260" cy="210" rx="20" ry="12" fill="#eee" stroke="#555" stroke-width="1.5"/>
    <ellipse cx="340" cy="210" rx="20" ry="12" fill="#eee" stroke="#555" stroke-width="1.5"/>
    <circle cx="260" cy="210" r="8" fill="#333"/>
    <circle cx="340" cy="210" r="8" fill="#333"/>
    <circle cx="262" cy="208" r="3" fill="#fff"/>
    <circle cx="342" cy="208" r="3" fill="#fff"/>

    <!-- Nose -->
    <path d="M300 220 L295 270 Q300 280 305 270 L300 220" fill="none" stroke="#666" stroke-width="2"/>

    <!-- Mouth - subtle smile -->
    <path d="M260 310 Q300 335 340 310" fill="none" stroke="#555" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Nasolabial folds -->
    <path d="M270 280 Q265 295 265 310" fill="none" stroke="#888" stroke-width="1" opacity="0.5"/>
    <path d="M330 280 Q335 295 335 310" fill="none" stroke="#888" stroke-width="1" opacity="0.5"/>

    <!-- Neck -->
    <path d="M230 370 L220 480 Q300 500 380 480 L370 370" fill="url(#shading)" stroke="#666" stroke-width="1.5"/>

    <!-- Collar/Shirt -->
    <path d="M180 480 L220 420 L280 480 L300 450 L320 480 L380 420 L420 480 L420 600 L180 600 Z"
          fill="#ccc" stroke="#888" stroke-width="2"/>

    <!-- Collar details -->
    <path d="M220 420 L280 480" fill="none" stroke="#999" stroke-width="1.5"/>
    <path d="M380 420 L320 480" fill="none" stroke="#999" stroke-width="1.5"/>
    <path d="M280 480 L300 520" fill="none" stroke="#aaa" stroke-width="1"/>
    <path d="M320 480 L300 520" fill="none" stroke="#aaa" stroke-width="1"/>
  </g>

  <!-- Additional sketch lines for texture -->
  <g stroke="#999" stroke-width="0.5" opacity="0.3" fill="none">
    <path d="M200 150 Q220 140 240 145"/>
    <path d="M360 145 Q380 140 400 150"/>
    <path d="M185 200 Q175 220 180 250"/>
    <path d="M415 200 Q425 220 420 250"/>
  </g>
</svg>
